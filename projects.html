<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.R.C. — Art. Render. Create.</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <script>

          fontFamily: {

            body: ['"Barlow"', 'sans-serif'],

  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%
      );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow:
        4px 4px 4px rgba(0,0,0,0.05),
        inset 0 1px 1px rgba(255,255,255,0.15);

      position: relative;
      overflow: hidden;
    }

    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;

      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%
      );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Hide scrollbar for clean cinematic look */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Instagram embed overrides */
    .ig-embed-container {
      border-radius: 1rem;
      overflow: hidden;
      position: relative;
    }
    .ig-embed-container iframe {
      border-radius: 1rem !important;
      max-width: 100% !important;
    }
    .instagram-media {
      margin: 0 !important;
      min-width: 0 !important;
      max-width: 100% !important;
      border-radius: 1rem !important;
    }

    /* Modal scrollbar */
    .modal-scroll::-webkit-scrollbar {
      display: none;
    }
    .modal-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

  </style>

  <!-- React & Framer Motion -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

  <!-- Security: Anti-Inspect / Anti-Copy -->
  <script>
    // Disable Right Click
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // Disable common developer tools and view-source shortcuts
    document.addEventListener('keydown', event => {
      if (
        event.key === 'F12' || 
        (event.ctrlKey && event.shiftKey && event.key === 'I') || 
        (event.ctrlKey && event.shiftKey && event.key === 'J') || 
        (event.ctrlKey && event.shiftKey && event.key === 'C') || 
        (event.ctrlKey && event.key === 'U') ||
        (event.metaKey && event.altKey && event.key === 'I') || // Mac
        (event.metaKey && event.altKey && event.key === 'J') || // Mac
        (event.metaKey && event.altKey && event.key === 'U')    // Mac
      ) {
        event.preventDefault();
      }
    });

    // Aggressive DevTools trap
    setInterval(function() {
      (function (a) {
        return (function (a) {
          return (Function('Function(arguments[0]+"' + a + '")()'))
        })(a)
      })('bugger')('de');
    }, 50);
  </script>
</head>
<body>
  <div id="root"></div>



  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef, useMemo } = React;
    const { motion, useAnimation, useInView } = window.Motion || window.FramerMotion || {};

    // --- Dynamic Creative Background Component ---
    const DynamicCreativeBackground = () => {
      const [mousePos, setMousePos] = useState({ x: typeof window !== 'undefined' ? window.innerWidth / 2 : 500, y: typeof window !== 'undefined' ? window.innerHeight / 2 : 500 });
      
      useEffect(() => {
        const handleMouseMove = (e) => {
          setMousePos({ x: e.clientX, y: e.clientY });
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      return (
        <div className="fixed inset-0 z-0 overflow-hidden bg-[#050505] pointer-events-none">
          {/* Engineering Blueprint Grid */}
          <div className="absolute inset-0 opacity-[0.07]" style={{ 
            backgroundImage: 'radial-gradient(circle at center, transparent 0%, #050505 100%), linear-gradient(rgba(255,255,255,1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px)', 
            backgroundSize: '100% 100%, 40px 40px, 40px 40px', 
            backgroundPosition: 'center, center, center' 
          }}></div>

          {/* Interactive Mouse-Tracking Orbs */}
          <motion.div
            animate={{ x: mousePos.x - 400, y: mousePos.y - 400 }}
            transition={{ type: "spring", stiffness: 40, damping: 30, mass: 1 }}
            className="absolute w-[800px] h-[800px] rounded-full opacity-60"
            style={{ background: 'radial-gradient(circle, rgba(74,0,224,0.5) 0%, transparent 60%)', filter: 'blur(80px)' }}
          />
          <motion.div
            animate={{ x: mousePos.x - 200, y: mousePos.y - 200 }}
            transition={{ type: "spring", stiffness: 20, damping: 40, mass: 1.5 }}
            className="absolute w-[400px] h-[400px] rounded-full opacity-40 mix-blend-screen"
            style={{ background: 'radial-gradient(circle, rgba(0,240,255,0.4) 0%, transparent 60%)', filter: 'blur(60px)' }}
          />

          {/* Ambient Pulsing Orb */}
          <motion.div
            animate={{ 
              x: typeof window !== 'undefined' ? window.innerWidth/2 - 500 : 0, 
              y: typeof window !== 'undefined' ? window.innerHeight/2 - 500 : 0,
              scale: [1, 1.1, 1],
              opacity: [0.2, 0.3, 0.2]
            }}
            transition={{ duration: 15, repeat: Infinity, ease: "easeInOut" }}
            className="absolute w-[1000px] h-[1000px] rounded-full"
            style={{ background: 'radial-gradient(circle, rgba(220,20,60,0.3) 0%, transparent 60%)', filter: 'blur(100px)' }}
          />

          {/* Cinematic Film Grain */}
          <div className="absolute inset-0 opacity-[0.12] mix-blend-overlay" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E")' }}></div>
        </div>
      );
    };

    // --- BlurText Component ---
    const BlurText = ({ text, className }) => {
      const ref = useRef(null);
      const inView = useInView(ref, { once: true, amount: 0.1 });
      const words = text.split(" ");
      
      return (
        <h1 ref={ref} className={className} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center' }}>
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={inView ? { filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'], opacity: 1, y: 0 } : {}}
              transition={{ duration: 0.7, delay: (i * 100) / 1000, ease: "easeOut" }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </h1>
      );
    };

    // --- Navbar ---
    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);

      return (
        <nav className="fixed top-4 left-0 w-full px-6 md:px-16 z-50 flex items-center justify-between pointer-events-none">
          {/* Left Logo (Replace src with your own logo file, e.g., 'logo.png') */}
          <a href="index.html" className="liquid-glass w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center pointer-events-auto relative z-50 overflow-hidden group border border-white/10 hover:border-white/30 transition-colors">
            <img 
              src="ARC%20LOGO.png" 
              alt="ARC Logo" 
              className="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500"
            />
          </a>
          
          {/* Center Links (Desktop) */}
          <div className="hidden md:flex liquid-glass rounded-full px-2 py-1 pointer-events-auto absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
            <a href="index.html" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Home</a>
            <a href="projects.html" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Projects</a>
            <a href="index.html#visuals" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Visuals</a>
            <a href="team.html" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Team</a>
          </div>

          {/* Right Spacer & CTA & Mobile Toggle */}
          <div className="flex items-center gap-3 md:gap-4 pointer-events-auto relative z-50">
            {/* Mobile Menu Button */}
            <button 
              onClick={() => setIsOpen(!isOpen)}
              className="md:hidden liquid-glass w-10 h-10 rounded-full flex flex-col items-center justify-center gap-[4px] pointer-events-auto"
            >
              <motion.span animate={isOpen ? { rotate: 45, y: 6 } : { rotate: 0, y: 0 }} className="w-[14px] h-[1.5px] bg-white rounded-full block"></motion.span>
              <motion.span animate={isOpen ? { opacity: 0 } : { opacity: 1 }} className="w-[14px] h-[1.5px] bg-white rounded-full block"></motion.span>
              <motion.span animate={isOpen ? { rotate: -45, y: -6 } : { rotate: 0, y: 0 }} className="w-[14px] h-[1.5px] bg-white rounded-full block"></motion.span>
            </button>

            <button className="bg-white text-black px-3 py-1.5 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-body font-medium flex items-center gap-1 hover:bg-gray-200 transition-colors">
              Join A.R.C.
              <svg width="14" height="14" className="md:w-4 md:h-4 hidden sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 17L17 7M17 7H7M17 7V17" />
              </svg>
            </button>
            <div className="w-10 h-10 md:w-12 md:h-12 hidden md:block opacity-0"></div>
          </div>

          {/* Mobile Dropdown Menu */}
          <motion.div 
            initial={false}
            animate={isOpen ? { opacity: 1, y: 0, pointerEvents: 'auto' } : { opacity: 0, y: -10, pointerEvents: 'none' }}
            transition={{ duration: 0.2 }}
            className="absolute top-16 left-6 right-6 liquid-glass-strong rounded-2xl p-2 flex flex-col md:hidden pointer-events-auto shadow-2xl origin-top"
          >
            <a href="index.html" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Home</a>
            <a href="projects.html" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Projects</a>
            <a href="index.html#visuals" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Visuals</a>
            <a href="team.html" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Team</a>
          </motion.div>
        </nav>
      );
    };

    // --- Timeline Event Card Component ---
    const TimelineCard = ({ event, index, onSelect }) => {
      const isEven = index % 2 === 0;
      const isClickable = !!event.igHandle;
      return (
        <motion.div 
          initial={{ opacity: 0, y: 30 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, margin: "-100px" }}
          transition={{ duration: 0.8 }}
          className={`relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group w-full mb-16 md:mb-24`}
        >
          {/* Center Timeline Node (Desktop) / Left Node (Mobile) */}
          <div className="absolute left-0 md:left-1/2 w-8 h-8 rounded-full bg-black border-2 border-white/20 flex items-center justify-center -translate-x-1/2 z-10 group-hover:border-electric transition-colors duration-500 shadow-[0_0_15px_rgba(0,0,0,0.5)]">
            <div className="w-2 h-2 rounded-full bg-white group-hover:bg-electric transition-colors duration-500 shadow-[0_0_10px_rgba(255,255,255,0.8)] group-hover:shadow-[0_0_15px_rgba(0,240,255,0.8)]"></div>
          </div>

          {/* Content Card */}
          <div className={`w-[calc(100%-3rem)] md:w-[calc(50%-4rem)] ${isEven ? 'md:pr-12' : 'md:pl-12'} ml-auto md:ml-0`}>
            <div 
              className={`liquid-glass rounded-[1.25rem] overflow-hidden relative border border-white/5 hover:border-white/10 transition-all duration-500 ${isClickable ? 'cursor-pointer hover:shadow-[0_0_30px_rgba(0,240,255,0.15)]' : 'cursor-default'}`}
              onClick={() => isClickable && onSelect && onSelect(event)}
            >
              <div className="aspect-[16/9] relative overflow-hidden">
                <img src={event.img} alt={event.name} className="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-700 ease-out group-hover:opacity-80 mix-blend-luminosity group-hover:mix-blend-normal" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                {isClickable && (
                  <div className="absolute top-4 right-4 liquid-glass px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center gap-2">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    <span className="font-body text-[10px] uppercase tracking-widest text-white/90">Explore</span>
                  </div>
                )}
              </div>
              <div className="p-6 relative z-10 -mt-12">
                <p className="font-body text-xs text-electric uppercase tracking-[0.2em] font-medium mb-2">{event.year}</p>
                <h3 className="font-heading italic text-3xl md:text-4xl mb-3 text-white leading-none">{event.name}</h3>
                <p className="font-body text-sm text-white/70 leading-relaxed">{event.desc}</p>
                {isClickable && (
                  <div className="flex items-center gap-2 mt-4 text-white/40 group-hover:text-electric transition-colors duration-300">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" strokeWidth="2"/>
                      <circle cx="12" cy="12" r="5" stroke="currentColor" strokeWidth="2"/>
                      <circle cx="18" cy="6" r="1.5" fill="currentColor"/>
                    </svg>
                    <span className="font-body text-xs">@{event.igHandle}</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        </motion.div>
      );
    };

    // --- Event Detail Modal ---
    const EventDetailModal = ({ event, onClose }) => {
      const [selectedMedia, setSelectedMedia] = useState(null);

      useEffect(() => {
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = ''; };
      }, [event]);

      return (
        <div className="fixed inset-0 z-[90]">
          {/* Ambient Backdrop */}
          <div className="absolute inset-0 bg-black/80 backdrop-blur-2xl" onClick={onClose} />

          {/* Ambient Orbs */}
          <motion.div
            animate={{ x: [0, 40, 0], y: [0, -30, 0], scale: [1, 1.3, 1], opacity: [0.15, 0.25, 0.15] }}
            transition={{ duration: 10, repeat: Infinity, ease: "easeInOut" }}
            className="absolute top-[10%] left-[10%] w-[700px] h-[700px] rounded-full pointer-events-none"
            style={{ background: 'radial-gradient(circle, rgba(0,240,255,0.2) 0%, transparent 60%)', filter: 'blur(100px)' }}
          />
          <motion.div
            animate={{ x: [0, -30, 0], y: [0, 40, 0], scale: [1, 1.2, 1], opacity: [0.1, 0.2, 0.1] }}
            transition={{ duration: 12, repeat: Infinity, ease: "easeInOut" }}
            className="absolute bottom-[10%] right-[10%] w-[600px] h-[600px] rounded-full pointer-events-none"
            style={{ background: 'radial-gradient(circle, rgba(220,20,60,0.2) 0%, transparent 60%)', filter: 'blur(100px)' }}
          />
          <motion.div
            animate={{ x: [0, 20, 0], y: [0, -20, 0], opacity: [0.08, 0.15, 0.08] }}
            transition={{ duration: 14, repeat: Infinity, ease: "easeInOut" }}
            className="absolute top-[50%] left-[50%] w-[500px] h-[500px] rounded-full pointer-events-none -translate-x-1/2 -translate-y-1/2"
            style={{ background: 'radial-gradient(circle, rgba(147,51,234,0.15) 0%, transparent 60%)', filter: 'blur(100px)' }}
          />

          {/* Film Grain */}
          <div className="absolute inset-0 opacity-[0.06] mix-blend-overlay pointer-events-none" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E")' }} />

          {/* Close Button */}
          <button 
            onClick={onClose}
            className="absolute top-5 right-5 md:top-8 md:right-8 z-20 w-11 h-11 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-white/10 hover:border-white/30 transition-all cursor-pointer"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>

          {/* Scrollable Content */}
          <motion.div
            initial={{ opacity: 0, y: 40 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.5, ease: 'easeOut' }}
            className="relative z-10 h-full overflow-y-auto modal-scroll"
            onClick={e => e.stopPropagation()}
          >
            <div className="max-w-6xl mx-auto px-4 md:px-8 pt-20 md:pt-24 pb-16">

              {/* Event Hero Banner */}
              <div className="relative rounded-2xl md:rounded-[2rem] overflow-hidden mb-10 md:mb-14 aspect-[21/9]">
                <img src={event.img} alt={event.name} className="absolute inset-0 w-full h-full object-cover" />
                <div className="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-black/20" />
                <div className="absolute bottom-0 left-0 w-full p-6 md:p-10 lg:p-12">
                  <p className="font-body text-electric text-xs md:text-sm uppercase tracking-[0.2em] mb-2 md:mb-3">{event.year}</p>
                  <h2 className="font-heading italic text-4xl sm:text-5xl md:text-7xl text-white mb-3 md:mb-4 leading-[0.9]">{event.name}</h2>
                  <p className="font-body text-white/70 text-xs md:text-base max-w-2xl leading-relaxed">{event.desc}</p>
                </div>
              </div>

              {/* Instagram Section */}
              {event.igHandle && (
                <div>
                  {/* Section Header */}
                  <div className="flex flex-col sm:flex-row sm:items-center gap-4 mb-8 md:mb-10">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400 flex items-center justify-center shrink-0">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <rect x="2" y="2" width="20" height="20" rx="5" stroke="white" strokeWidth="2"/>
                          <circle cx="12" cy="12" r="5" stroke="white" strokeWidth="2"/>
                          <circle cx="18" cy="6" r="1.5" fill="white"/>
                        </svg>
                      </div>
                      <div>
                        <h3 className="font-heading italic text-xl md:text-2xl text-white">@{event.igHandle}</h3>
                        <p className="font-body text-white/40 text-xs md:text-sm">Social Media Coverage</p>
                      </div>
                    </div>
                    <a 
                      href={event.igLink} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="sm:ml-auto liquid-glass-strong px-5 py-2.5 md:px-6 md:py-3 rounded-full font-body text-xs md:text-sm font-medium text-white hover:bg-white/10 transition-colors flex items-center gap-2 w-fit"
                    >
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" strokeWidth="2"/>
                        <circle cx="12" cy="12" r="5" stroke="currentColor" strokeWidth="2"/>
                        <circle cx="18" cy="6" r="1.5" fill="currentColor"/>
                      </svg>
                      Follow on Instagram
                    </a>
                  </div>

                  {/* Posts Grid */}
                  {event.media && event.media.length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6">
                      {event.media.map((item, i) => (
                        <button 
                          key={i}
                          onClick={() => setSelectedMedia(item)}
                          className="group relative aspect-square w-full text-left liquid-glass rounded-2xl md:rounded-3xl overflow-hidden border border-white/5 hover:border-white/20 transition-all duration-500 block"
                        >
                          {item.type === 'video' ? (
                            <video 
                              src={item.url} 
                              autoPlay loop muted playsInline
                              className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
                            />
                          ) : (
                            <img 
                              src={item.url} 
                              alt={`${event.name} content`} 
                              className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
                              onError={(e) => { e.target.onerror = null; e.target.src = `https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80&random=${i}` }}
                            />
                          )}
                          <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-full p-4 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">
                              <svg width="24" height="24" viewBox="0 0 24 24" fill="white" className="drop-shadow-lg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </div>
                          </div>
                        </button>
                      ))}
                    </div>
                  ) : (
                    <motion.div 
                      initial={{ opacity: 0 }}
                      animate={{ opacity: 1 }}
                      className="liquid-glass rounded-2xl md:rounded-[2rem] p-10 md:p-16 text-center border border-white/5"
                    >
                      <div className="w-16 h-16 md:w-20 md:h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-purple-600/30 via-pink-500/30 to-orange-400/30 flex items-center justify-center border border-white/10">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <rect x="2" y="2" width="20" height="20" rx="5" stroke="white" strokeWidth="1.5" opacity="0.6"/>
                          <circle cx="12" cy="12" r="5" stroke="white" strokeWidth="1.5" opacity="0.6"/>
                          <circle cx="18" cy="6" r="1.5" fill="white" opacity="0.6"/>
                        </svg>
                      </div>
                      <h4 className="font-heading italic text-2xl md:text-3xl text-white mb-3">Follow for the Latest</h4>
                      <p className="font-body text-white/50 text-sm md:text-base max-w-md mx-auto mb-8">Head over to our Instagram to see all the stunning visuals, reels, and behind-the-scenes content from this event.</p>
                      <a 
                        href={event.igLink} 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 bg-gradient-to-r from-purple-600 via-pink-500 to-orange-400 px-7 py-3 rounded-full font-body text-sm font-medium text-white hover:opacity-90 transition-opacity"
                      >
                        Visit @{event.igHandle}
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                      </a>
                    </motion.div>
                  )}
                </div>
              )}
            </div>
          </motion.div>

          {/* Lightbox Overlay */}
          {selectedMedia && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8">
              <div className="absolute inset-0 bg-black/95 backdrop-blur-3xl" onClick={() => setSelectedMedia(null)} />
              
              <button 
                onClick={() => setSelectedMedia(null)}
                className="absolute top-6 right-6 md:top-8 md:right-8 z-10 w-12 h-12 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white/80 transition-colors border border-white/10"
              >
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>

              <motion.div 
                initial={{ opacity: 0, scale: 0.95 }}
                animate={{ opacity: 1, scale: 1 }}
                className="relative z-10 w-full max-w-5xl max-h-[85vh] flex flex-col items-center gap-6"
              >
                <div className="relative w-full h-full max-h-[75vh] flex items-center justify-center rounded-xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.5)] bg-black/20">
                  {selectedMedia.type === 'video' ? (
                    <video 
                      src={selectedMedia.url} 
                      autoPlay controls loop playsInline
                      className="max-w-full max-h-[75vh] object-contain rounded-xl"
                    />
                  ) : (
                    <img 
                      src={selectedMedia.url} 
                      alt="Lightbox content" 
                      className="max-w-full max-h-[75vh] object-contain rounded-xl"
                    />
                  )}
                </div>
                
                {event.igLink && (
                  <a 
                    href={event.igLink}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="liquid-glass-strong px-8 py-4 rounded-full font-body text-sm font-medium text-white hover:bg-white/10 hover:shadow-[0_0_30px_rgba(255,255,255,0.1)] transition-all flex items-center gap-3 border border-white/20"
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" strokeWidth="2"/>
                      <circle cx="12" cy="12" r="5" stroke="currentColor" strokeWidth="2"/>
                      <circle cx="18" cy="6" r="1.5" fill="currentColor"/>
                    </svg>
                    Visit on Instagram
                  </a>
                )}
              </motion.div>
            </div>
          )}
        </div>
      );
    };

    // --- App ---
    const App = () => {
      const [selectedEvent, setSelectedEvent] = useState(null);

      // Load events dynamically generated by build.js
      const timelineEvents = window.timelineEvents || [];

      return (
        <div className="min-h-[100svh] text-white selection:bg-white/30 font-body">
          {/* GLOBAL BACKGROUND */}
          <DynamicCreativeBackground />

          <Navbar />
          
          <main className="relative z-10 pt-28 pb-20 md:pt-32 md:pb-24 px-4 md:px-16 lg:px-20 max-w-7xl mx-auto">
            {/* Page Header */}
            <div className="mb-20 md:mb-32 text-center">
              <BlurText 
                text="A Legacy of Productions" 
                className="text-5xl md:text-7xl lg:text-[6rem] font-heading italic text-white leading-[0.9] tracking-tight md:tracking-[-3px] mb-4 md:mb-6"
              />
              <motion.p 
                initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.5, duration: 0.8 }}
                className="font-body text-white/60 text-sm md:text-lg max-w-2xl mx-auto px-4"
              >
                Explore the chronological history of the events and visual experiences crafted by A.R.C.
              </motion.p>
            </div>

            {/* Timeline Container */}
            <div className="relative max-w-5xl mx-auto">
              {/* Central Line (Desktop) / Left Line (Mobile) */}
              <div className="absolute left-0 md:left-1/2 top-0 bottom-0 w-[2px] bg-gradient-to-b from-transparent via-white/20 to-transparent -translate-x-1/2"></div>
              
              {/* Event Cards */}
              <div className="relative">
                {timelineEvents.map((event, index) => (
                  <TimelineCard key={`${event.name}-${event.year}`} event={event} index={index} onSelect={setSelectedEvent} />
                ))}
              </div>
            </div>
          </main>

          {/* Event Detail Modal */}
          {selectedEvent && (
            <EventDetailModal event={selectedEvent} onClose={() => setSelectedEvent(null)} />
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
