<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team & Leadership — A.R.C. (Art. Render. Create.)</title>
  <meta name="description" content="Meet the directors, visual engineers, and creative producers behind A.R.C. at IEM Kolkata — pushing the boundaries of immersive media.">
  <link rel="canonical" href="https://arc-landing-page.vercel.app/team.html">
  <link rel="icon" type="image/png" href="ARC%20LOGO.png">
  <meta name="theme-color" content="#050505">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arc-landing-page.vercel.app/team.html">
  <meta property="og:title" content="Team & Leadership — A.R.C.">
  <meta property="og:description" content="Meet the creative force powering A.R.C.'s visual identity at IEM Kolkata.">
  <meta property="og:image" content="https://arc-landing-page.vercel.app/ARC%20LOGO.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Team & Leadership — A.R.C.">
  <meta name="twitter:description" content="Meet the creative force powering A.R.C.'s visual identity at IEM Kolkata.">
  <meta name="twitter:image" content="https://arc-landing-page.vercel.app/ARC%20LOGO.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Instrument Serif"', 'serif'],
            body: ['"Barlow"', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: "9999px",
          },
          colors: {
            chrome: '#e8e9eb',
            silver: '#c0c0c0',
            electric: '#00f0ff',
            deepPurple: '#4a00e0',
            crimson: '#dc143c'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%
      );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow:
        4px 4px 4px rgba(0,0,0,0.05),
        inset 0 1px 1px rgba(255,255,255,0.15);

      position: relative;
      overflow: hidden;
    }

    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;

      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%
      );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* 3D Card Utilities */
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    /* Hide scrollbar for clean cinematic look */
    ::-webkit-scrollbar {
      display: none;
    }

  </style>

  <!-- React & Framer Motion -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

  <!-- Cookie Consent Banner -->
  <script src="cookie-banner.js" defer></script>
</head>
<body>
  <div id="root"></div>



  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef, useMemo } = React;
    const { motion, useAnimation, useInView } = window.Motion || window.FramerMotion || {};

    // --- Dynamic Creative Background Component ---
    const DynamicCreativeBackground = () => {
      const [mousePos, setMousePos] = useState({ x: typeof window !== 'undefined' ? window.innerWidth / 2 : 500, y: typeof window !== 'undefined' ? window.innerHeight / 2 : 500 });
      
      useEffect(() => {
        const handleMouseMove = (e) => {
          setMousePos({ x: e.clientX, y: e.clientY });
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      return (
        <div className="fixed inset-0 z-0 overflow-hidden bg-[#050505] pointer-events-none">
          {/* Engineering Blueprint Grid */}
          <div className="absolute inset-0 opacity-[0.07]" style={{ 
            backgroundImage: 'radial-gradient(circle at center, transparent 0%, #050505 100%), linear-gradient(rgba(255,255,255,1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px)', 
            backgroundSize: '100% 100%, 40px 40px, 40px 40px', 
            backgroundPosition: 'center, center, center' 
          }}></div>

          {/* Interactive Mouse-Tracking Orbs */}
          <motion.div
            animate={{ x: mousePos.x - 400, y: mousePos.y - 400 }}
            transition={{ type: "spring", stiffness: 40, damping: 30, mass: 1 }}
            className="absolute w-[800px] h-[800px] rounded-full opacity-60"
            style={{ background: 'radial-gradient(circle, rgba(74,0,224,0.5) 0%, transparent 60%)', filter: 'blur(80px)' }}
          />
          <motion.div
            animate={{ x: mousePos.x - 200, y: mousePos.y - 200 }}
            transition={{ type: "spring", stiffness: 20, damping: 40, mass: 1.5 }}
            className="absolute w-[400px] h-[400px] rounded-full opacity-40 mix-blend-screen"
            style={{ background: 'radial-gradient(circle, rgba(0,240,255,0.4) 0%, transparent 60%)', filter: 'blur(60px)' }}
          />

          {/* Ambient Pulsing Orb */}
          <motion.div
            animate={{ 
              x: typeof window !== 'undefined' ? window.innerWidth/2 - 500 : 0, 
              y: typeof window !== 'undefined' ? window.innerHeight/2 - 500 : 0,
              scale: [1, 1.1, 1],
              opacity: [0.2, 0.3, 0.2]
            }}
            transition={{ duration: 15, repeat: Infinity, ease: "easeInOut" }}
            className="absolute w-[1000px] h-[1000px] rounded-full"
            style={{ background: 'radial-gradient(circle, rgba(220,20,60,0.3) 0%, transparent 60%)', filter: 'blur(100px)' }}
          />

          {/* Cinematic Film Grain */}
          <div className="absolute inset-0 opacity-[0.12] mix-blend-overlay" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E")' }}></div>
        </div>
      );
    };

    // --- BlurText Component ---
    const BlurText = ({ text, className }) => {
      const ref = useRef(null);
      const inView = useInView(ref, { once: true, amount: 0.1 });
      const words = text.split(" ");
      
      return (
        <h1 ref={ref} className={className} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center' }}>
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={inView ? { filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'], opacity: 1, y: 0 } : {}}
              transition={{ duration: 0.7, delay: (i * 100) / 1000, ease: "easeOut" }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </h1>
      );
    };

    // --- Member Card Component ---
    const MemberCard = ({ name, role, hue }) => {
      const [isFlipped, setIsFlipped] = useState(false);
      
      const glowColor = hue === 'gold' ? 'rgba(255, 215, 0, 0.4)' : 'rgba(147, 51, 234, 0.4)';
      const borderColor = hue === 'gold' ? 'border-yellow-500/30' : 'border-purple-500/30';
      const textHue = hue === 'gold' ? 'text-yellow-400' : 'text-purple-400';
      const bgHue = hue === 'gold' ? 'from-yellow-900/40' : 'from-purple-900/40';

      return (
        <div 
          className="relative w-full aspect-[3/4] cursor-pointer perspective-1000 group"
          onClick={() => setIsFlipped(!isFlipped)}
        >
          <motion.div 
            className="w-full h-full relative preserve-3d transition-transform duration-500 group-hover:-translate-y-2"
            animate={{ rotateY: isFlipped ? 180 : 0 }}
            transition={{ duration: 0.6, type: 'spring', stiffness: 260, damping: 20 }}
          >
            {/* Front */}
            <div className={`absolute inset-0 backface-hidden liquid-glass rounded-[1.5rem] overflow-hidden border border-white/10 group-hover:${borderColor} transition-colors flex flex-col`} style={{ boxShadow: `0 0 20px ${glowColor}00` }} >
              <img 
                src={`team/${name.replace(/ /g, '_')}.jpg?v=2026.08.14`} 
                alt={name} 
                className="absolute inset-0 w-full h-full object-cover transition-all duration-500 group-hover:scale-105" 
                onError={(e) => { e.target.onerror = null; e.target.src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80" }}
              />
              <div className="absolute bottom-0 left-0 w-full h-2/3 bg-gradient-to-t from-black/80 to-transparent pointer-events-none"></div>
              <div className="absolute bottom-0 left-0 w-full p-6 z-10">
                <h3 className="font-heading italic text-3xl mb-1 text-white leading-none">{name}</h3>
                <p className={`font-body text-xs uppercase tracking-widest ${textHue}`}>{role}</p>
              </div>
            </div>
            
            {/* Back */}
            <div className={`absolute inset-0 backface-hidden rotate-y-180 liquid-glass rounded-[1.5rem] p-6 border ${borderColor} flex flex-col justify-center items-center text-center`} style={{ boxShadow: `inset 0 0 40px ${glowColor}` }}>
              <h3 className="font-heading italic text-2xl mb-4 text-white">{name}</h3>
              <p className="font-body text-sm text-white/80 leading-relaxed">
                Visual engineering, creative direction, and cinematic storytelling. Dedicated to pushing the boundaries of immersive media at A.R.C.
              </p>
              <p className={`mt-8 font-body text-[10px] uppercase tracking-widest ${textHue} opacity-70`}>Click to flip back</p>
            </div>
          </motion.div>
        </div>
      );
    };

    // --- Navbar ---
    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);

      return (
        <nav className="fixed top-4 left-0 w-full px-6 md:px-16 z-50 flex items-center justify-between pointer-events-none">
          {/* Left Logo (Replace src with your own logo file, e.g., 'logo.png') */}
          <a href="index.html" className="liquid-glass w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center pointer-events-auto relative z-50 overflow-hidden group border border-white/10 hover:border-white/30 transition-colors">
            <img 
              src="ARC%20LOGO.png" 
              alt="ARC Logo" 
              className="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500"
            />
          </a>
          
          {/* Center Links (Desktop) */}
          <div className="hidden md:flex liquid-glass rounded-full px-2 py-1 pointer-events-auto absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
            <a href="index.html" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Home</a>
            <a href="projects.html" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Projects</a>
            <a href="index.html#visuals" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Visuals</a>
            <a href="team.html" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">Team</a>
          </div>

          {/* Right Spacer & CTA & Mobile Toggle */}
          <div className="flex items-center gap-3 md:gap-4 pointer-events-auto relative z-50">
            {/* Mobile Menu Button */}
            <button 
              onClick={() => setIsOpen(!isOpen)}
              className="md:hidden liquid-glass w-10 h-10 rounded-full flex flex-col items-center justify-center gap-[4px] pointer-events-auto"
            >
              <motion.span animate={isOpen ? { rotate: 45, y: 6 } : { rotate: 0, y: 0 }} className="w-[14px] h-[1.5px] bg-white rounded-full block"></motion.span>
              <motion.span animate={isOpen ? { opacity: 0 } : { opacity: 1 }} className="w-[14px] h-[1.5px] bg-white rounded-full block"></motion.span>
              <motion.span animate={isOpen ? { rotate: -45, y: -6 } : { rotate: 0, y: 0 }} className="w-[14px] h-[1.5px] bg-white rounded-full block"></motion.span>
            </button>

            <a href="index.html" className="bg-white text-black px-3 py-1.5 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-body font-medium flex items-center gap-1 hover:bg-gray-200 transition-colors">
              Join A.R.C.
              <svg width="14" height="14" className="md:w-4 md:h-4 hidden sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 17L17 7M17 7H7M17 7V17" />
              </svg>
            </a>
            <div className="w-10 h-10 md:w-12 md:h-12 hidden md:block opacity-0"></div>
          </div>

          {/* Mobile Dropdown Menu */}
          <motion.div 
            initial={false}
            animate={isOpen ? { opacity: 1, y: 0, pointerEvents: 'auto' } : { opacity: 0, y: -10, pointerEvents: 'none' }}
            transition={{ duration: 0.2 }}
            className="absolute top-16 left-6 right-6 liquid-glass-strong rounded-2xl p-2 flex flex-col md:hidden pointer-events-auto shadow-2xl origin-top"
          >
            <a href="index.html" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Home</a>
            <a href="projects.html" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Projects</a>
            <a href="index.html#visuals" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Visuals</a>
            <a href="team.html" onClick={() => setIsOpen(false)} className="px-4 py-3 text-sm font-medium text-white/90 font-body hover:bg-white/10 rounded-xl transition-colors">Team</a>
          </motion.div>
        </nav>
      );
    };

    // --- App ---
    const App = () => {
      const algorithmMembers = [
        "Paramartha Ghosh", "Adrika Kundu", "Sounak Maji", "Ankita Mandal", "Debjit Dey", "Sarvani Saha"
      ];
      const workingMembers = [
        "Swastika Das", "Rochishnu Bose", "Ayushman Paul", "Sayan Saha"
      ];

      return (
        <div className="min-h-[100svh] text-white selection:bg-white/30">
          {/* GLOBAL BACKGROUND */}
          <DynamicCreativeBackground />

          <Navbar />
          
          <main className="relative z-10 pt-28 pb-20 md:pt-32 md:pb-24 px-4 md:px-16 lg:px-20 max-w-7xl mx-auto">
            {/* Page Header */}
            <div className="mb-16 md:mb-24 text-center px-2">
              <BlurText 
                text="The Minds Behind the Magic" 
                className="text-4xl sm:text-5xl md:text-7xl lg:text-[5rem] font-heading italic text-white leading-[1] md:leading-[0.9] tracking-tight md:tracking-[-3px] mb-4 md:mb-6"
              />
              <motion.p 
                initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.5, duration: 0.8 }}
                className="font-body text-white/60 text-sm md:text-lg max-w-2xl mx-auto px-4"
              >
                Meet the creative force powering A.R.C.'s visual identity.
              </motion.p>
            </div>

            {/* Algorithm Tier */}
            <section className="mb-32">
              <div className="mb-8 md:mb-12 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 border-b border-white/10 pb-4">
                <div className="flex items-center gap-3 md:gap-4">
                  <div className="w-2 h-2 md:w-3 md:h-3 rounded-full bg-yellow-400 shrink-0" style={{ boxShadow: '0 0 10px rgba(255,215,0,0.8)' }}></div>
                  <h2 className="font-heading italic text-3xl md:text-4xl text-white">Algorithm</h2>
                </div>
                <span className="font-body text-[10px] md:text-xs uppercase tracking-widest text-white/40 sm:ml-auto">Core Leadership</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
                {algorithmMembers.map(name => (
                  <MemberCard key={name} name={name} role="Algorithm" hue="gold" />
                ))}
              </div>
            </section>

            {/* Working Members Tier */}
            <section>
              <div className="mb-8 md:mb-12 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 border-b border-white/10 pb-4">
                <div className="flex items-center gap-3 md:gap-4">
                  <div className="w-2 h-2 md:w-3 md:h-3 rounded-full bg-purple-500 shrink-0" style={{ boxShadow: '0 0 10px rgba(168,85,247,0.8)' }}></div>
                  <h2 className="font-heading italic text-3xl md:text-4xl text-white">Working Members</h2>
                </div>
                <span className="font-body text-[10px] md:text-xs uppercase tracking-widest text-white/40 sm:ml-auto">Core Production</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                {workingMembers.map(name => (
                  <MemberCard key={name} name={name} role="Working Member" hue="purple" />
                ))}
              </div>
              
              {/* 50+ More Members Indicator */}
              <div className="mt-16 flex justify-center px-4">
                <motion.div 
                  initial={{ opacity: 0, y: 10 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  viewport={{ once: true }}
                  transition={{ delay: 0.2, duration: 0.8 }}
                  className="liquid-glass px-6 py-4 md:px-10 md:py-5 rounded-3xl md:rounded-full border border-white/5 flex flex-col sm:flex-row items-center gap-3 md:gap-4 w-full sm:w-auto text-center"
                >
                  <span className="flex -space-x-2 shrink-0">
                    <div className="w-6 h-6 md:w-8 md:h-8 rounded-full bg-white/10 border-2 border-black"></div>
                    <div className="w-6 h-6 md:w-8 md:h-8 rounded-full bg-white/20 border-2 border-black"></div>
                    <div className="w-6 h-6 md:w-8 md:h-8 rounded-full bg-white/30 border-2 border-black"></div>
                  </span>
                  <p className="font-body text-xs md:text-sm text-white/70 tracking-wide uppercase">And <span className="text-white font-medium">50+</span> more incredible creators...</p>
                </motion.div>
              </div>
            </section>

          </main>

          {/* FOOTER */}
          <footer className="relative z-10 border-t border-white/10 mt-20 pt-16 pb-12 px-6 md:px-16 lg:px-20 liquid-glass">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-8 mb-12">
              <div className="flex items-center gap-4">
                <a href="index.html" className="w-12 h-12 rounded-full overflow-hidden border border-white/10 hover:border-white/30 transition-colors flex items-center justify-center liquid-glass">
                  <img src="ARC%20LOGO.png" alt="ARC Logo" className="w-full h-full object-contain" />
                </a>
                <div>
                  <h4 className="font-heading italic text-2xl text-white">A.R.C.</h4>
                  <p className="font-body text-xs text-white/50 tracking-wider uppercase">Art. Render. Create. // IEM Kolkata</p>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-6 text-sm font-body text-white/70">
                <a href="index.html" className="hover:text-white transition-colors">Home</a>
                <a href="projects.html" className="hover:text-white transition-colors">Projects</a>
                <a href="index.html#visuals" className="hover:text-white transition-colors">Visuals</a>
                <a href="team.html" className="hover:text-white transition-colors">Team</a>
                <a href="https://www.instagram.com/iemcomicverse" target="_blank" rel="noopener noreferrer" className="hover:text-[#00f0ff] transition-colors flex items-center gap-1.5">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" strokeWidth="2"/><circle cx="12" cy="12" r="5" stroke="currentColor" strokeWidth="2"/><circle cx="18" cy="6" r="1.5" fill="currentColor"/></svg>
                  Instagram
                </a>
              </div>
            </div>

            <div className="max-w-7xl mx-auto pt-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-body text-white/40">
              <p>&copy; 2026 A.R.C. — Art. Render. Create. All rights reserved.</p>
              <div className="flex items-center gap-4">
                <a href="privacy.html" className="hover:text-white transition-colors">Privacy Policy</a>
                <span>•</span>
                <a href="terms.html" className="hover:text-white transition-colors">Terms of Service</a>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
